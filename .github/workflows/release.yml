# release-please keeps a release PR open that bumps the versions listed in
# release-please-config.json and writes CHANGELOG.md from Conventional Commits.
# Merging that PR tags the version and publishes the GitHub Release.
#
# It acts as the agentkit release GitHub App. Pushes made with GITHUB_TOKEN start
# no workflows, so the release PR would never receive its required checks.
name: release

on:
  push:
    branches: [main]

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
