# release-please keeps a release PR open that bumps the versions listed in
# release-please-config.json and writes CHANGELOG.md from Conventional Commits.
# Merging that PR tags the version and publishes the GitHub Release.
name: release

on:
  push:
    branches: [main]

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
