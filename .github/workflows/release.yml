# release-please keeps a release PR open that bumps the versions listed in
# release-please-config.json and writes CHANGELOG.md from Conventional Commits.
# Merging that PR tags the version and publishes the GitHub Release.
name: release

on:
  push:
    branches: [main]

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
