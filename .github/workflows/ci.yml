name: ci
on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Linux covers macOS. Windows runs separately because links there are directory junctions.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install ruff==0.17.4
      # Windows runners do not ship GNU make, and setup-python names the interpreter python there.
      - if: runner.os == 'Windows'
        run: choco install make --no-progress -y
      - run: make test PYTHON=python
