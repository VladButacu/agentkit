name: ci
on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Linux covers macOS. Windows runs separately because links there are directory junctions.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      # Windows runners do not ship GNU make, and setup-python names the interpreter python there.
      - if: runner.os == 'Windows'
        run: choco install make --no-progress -y
      - run: make test PYTHON=python
