name: ci
on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Linux covers macOS. Windows runs separately because links there are directory junctions.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r .github/requirements-ci.txt
      # Windows runners do not ship GNU make, and setup-python names the interpreter python there.
      - if: runner.os == 'Windows'
        run: choco install make --no-progress -y
      - run: make test PYTHON=python
