# Electron Backend pyproject.toml Template
# Variables: {{MAINTAINER_NAME}}, {{MAINTAINER_EMAIL}}, {{HOMEPAGE_URL}}, {{PROJECT_NAME}}, {{PACKAGE_NAME}}, {{VERSION}}, {{DESCRIPTION}}

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
managed = true

# ============================================================================
# Project Metadata
# ============================================================================

[project]
name = "{{PROJECT_NAME}}"
version = "{{VERSION}}"
description = "{{DESCRIPTION}}"

authors = [{ name = "{{MAINTAINER_NAME}}", email = "{{MAINTAINER_EMAIL}}" }]
readme = "README.md"
requires-python = "~=3.12.10"
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Operating System :: OS Independent",
]

dependencies = [
    # Logging
    "loguru>=0.7.0",
    # FastAPI and web framework
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "sse-starlette>=2.0.0",
    # WebSocket
    "websockets>=12.0",
    # HTTP client
    "httpx>=0.27.0",
    # Configuration
    "pydantic",
    "pydantic-settings",
    "pyyaml>=6.0",
    # Environment
    "python-dotenv",
    # System utilities
    "psutil>=5.9.0",
]

# ============================================================================
# Dependency Groups
# ============================================================================

[dependency-groups]
dev = [
    # Testing
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-xdist>=3.5.0",
    "hypothesis>=6.100.0",
    "respx>=0.22.0",
    # Linting
    "ruff>=0.4.0",
]
build = [
    "pyarmor>=8.0.0",
    "pyinstaller>=6.0.0",
]
macos = [
    # macOS-specific dependencies (Apple Silicon)
    # Add platform-specific packages here, e.g.:
    # "mlx-whisper>=0.4.3 ; platform_machine == 'arm64'",
]
windows = []

# ============================================================================
# Hatch Configuration
# ============================================================================

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ============================================================================
# Ruff Configuration
# ============================================================================

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [
    "**/.venv/**",
    "**/venv/**",
    ".env",
    "__pycache__",
    "*.pyc",
    ".pytest_cache",
    ".coverage",
    "htmlcov",
    "**/dist/**",
    "build/**",
    "*.egg-info",
    ".tox",
    ".mypy_cache",
    ".ruff_cache",
]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D203",
    "D205",
    "D213",
    "D400",
    "D401",
    "D415",
    "TD002",
    "TD003",
    "FIX002",
    "S104",
    "E501",
    "COM812",
    "ERA001",
    "ANN001",
    "ANN201",
    "ANN401",
    "INP001",
    "EM101",
    "EM102",
    "TRY003",
    "G004",
    "PLR2004",
    "PLR0913",
    "TC003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "SLF001"]
"**/data/**/*" = ["ALL"]

[tool.ruff.format]
preview = true
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# ============================================================================
# Pytest Configuration
# ============================================================================

[tool.pytest.ini_options]
pythonpath = [".", "app"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--cov-report=xml:coverage.xml --cov-report=term-missing"
markers = [
    "asyncio: marks tests as async tests",
]
filterwarnings = [
    "ignore:builtin type Swig.*:DeprecationWarning",
    "ignore:builtin type swig.*:DeprecationWarning",
]

[tool.coverage.run]
source = ["app"]
omit = ["*/tests/*", "*/test_*", "*/__pycache__/*", "*/site-packages/*"]

[tool.coverage.report]
fail_under = 65
show_missing = true
skip_covered = true

# ============================================================================
# Pyright Configuration
# ============================================================================

[tool.pyright]
include = ["app"]
exclude = [
    ".venv",
    "venv",
    "__pycache__",
    "dist",
    "build",
    "*.egg-info",
    ".pytest_cache",
    ".mypy_cache",
    ".ruff_cache",
]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "basic"
reportMissingImports = true
reportMissingTypeStubs = false
